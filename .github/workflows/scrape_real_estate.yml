name: Scrape Real Estate Listings

on:
  schedule:
    - cron: '0 22,2,5,9 * * *' # 오전 7시, 11시, 오후 2시, 6시 KST (UTC 22:00, 02:00, 05:00, 09:00)
  workflow_dispatch: # 수동 실행 버튼 허용

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        run: |
          # Robust execution with long randomized delays between complexes to avoid 429
          python serverless_scraper.py

      - name: Validate Update
        run: |
          echo "Last Update in results.json:"
          [ -f data/results.json ] && grep "last_update" data/results.json || echo "results.json missing"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create data directory if it somehow doesn't exist to prevent git error
          mkdir -p data
          
          # Add all files in data directory and ignore missing ones
          git add data/ || true
          
          # Only commit if there are changes to avoid error on empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update listings: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
