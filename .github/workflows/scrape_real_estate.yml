name: Scrape Real Estate Listings

on:
  schedule:
    - cron: '0 1,3,6,9,12,15 * * *' # 하루 6회 KST (10, 12, 15, 18, 21, 00시)
  workflow_dispatch: # 수동 실행 버튼 허용

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        env:
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          # Use ScraperAPI proxy for South Korean residential IPs
          python serverless_scraper.py

      - name: Validate Update
        run: |
          echo "Last Update in results.json:"
          [ -f data/results.json ] && grep "last_update" data/results.json || echo "results.json missing"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create data directory if it somehow doesn't exist to prevent git error
          mkdir -p data
          
          # Add all files in data directory and ignore missing ones
          git add data/ || true
          
          # Only commit if there are changes to avoid error on empty commit
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update listings: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
