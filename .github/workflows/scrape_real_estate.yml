name: Scrape Real Estate Listings

# on:
#   schedule:
#     # 네이버 해외 IP 차단 정책으로 인해 로컬 윈도우 스케줄러 실행 권장
#     - cron: '7 20 * * *'
#     - cron: '7 0 * * *'
#     - cron: '7 2 * * *'
#     - cron: '7 4 * * *'
#     - cron: '7 6 * * *'
#     - cron: '7 9 * * *'
#     - cron: '7 12 * * *'
on:
  workflow_dispatch: # GitHub 웹 UI에서 수동 테스트 시에만 사용 가능

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          xvfb-run --auto-servernum python local_scraper.py

      - name: Validate Update
        run: |
          echo "==== Scrape Results Summary ===="
          [ -f data/results.json ] && python -c "import json; d=json.load(open('data/results.json', encoding='utf-8')); print('Last Update:', d.get('last_update')); print('Total Listings:', len(d.get('listings', []))); print('Summary:', d.get('summary'))" || echo "results.json missing"
          mkdir -p data
          echo "Last Run (KST): $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" > data/last_run.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p data
          git add data/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update listings (GitHub Actions): $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main || true
            git push origin main
          fi
