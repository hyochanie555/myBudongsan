name: Scrape Real Estate Listings

on:
  schedule:
    # 하루 5회 자동 실행 (KST 06:00, 11:00, 14:00, 17:00, 21:00 -> UTC 21:00, 02:00, 05:00, 08:00, 12:00)
    - cron: '0 2,5,8,12,21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 언제든 수동 실행 가능
  push:
    branches:
      - main
    paths:
      - '.github/workflows/scrape_real_estate.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright playwright-stealth

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          xvfb-run --auto-servernum python local_scraper.py

      - name: Validate Update
        run: |
          echo "Last Update in results.json:"
          [ -f data/results.json ] && grep "last_update" data/results.json || echo "results.json missing"

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p data
          git add data/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update listings (GitHub Actions): $(date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push origin main
          fi
