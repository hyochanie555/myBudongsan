name: Scrape Real Estate Listings

on:
  schedule:
    # 하루 7회 자동 실행 (KST 05:07, 09:07, 11:07, 13:07, 15:07, 18:07, 21:07)
    - cron: '7 20 * * *' # 05:07 KST (전날 20:07 UTC)
    - cron: '7 0 * * *'  # 09:07 KST (당일 00:07 UTC)
    - cron: '7 2 * * *'  # 11:07 KST (당일 02:07 UTC)
    - cron: '7 4 * * *'  # 13:07 KST (당일 04:07 UTC)
    - cron: '7 6 * * *'  # 15:07 KST (당일 06:07 UTC)
    - cron: '7 9 * * *'  # 18:07 KST (당일 09:07 UTC)
    - cron: '7 12 * * *' # 21:07 KST (당일 12:07 UTC)
  workflow_dispatch: # GitHub 웹 UI에서 언제든 수동 실행 가능
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
      - 'README.md'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Scraper
        run: |
          xvfb-run --auto-servernum python local_scraper.py

      - name: Validate Update
        run: |
          echo "==== Scrape Results Summary ===="
          [ -f data/results.json ] && python -c "import json; d=json.load(open('data/results.json', encoding='utf-8')); print('Last Update:', d.get('last_update')); print('Total Listings:', len(d.get('listings', []))); print('Summary:', d.get('summary'))" || echo "results.json missing"
          mkdir -p data
          echo "Last Run (KST): $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" > data/last_run.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p data
          git add data/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update listings (GitHub Actions): $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
            git pull --rebase origin main
            git push origin main
          fi
