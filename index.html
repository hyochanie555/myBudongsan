<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 부동산 Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./index.css?v=4.8">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="dashboard-header">
            <div>
                <h1>부동산 매물 현황 DashBoard</h1>
                <div class="subtitle-container" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem;">
                    <p class="subtitle" id="last-update" style="margin-top: 0;">데이터를 불러오는 중...</p>
                    <span id="battery-status" class="battery-badge" style="display: none;">🔋 --%</span>
                </div>
            </div>
            <div class="actions">
                <button id="trend-btn" class="secondary-btn" style="margin-right: 0.5rem; background-color: rgba(30, 64, 175, 0.5); border-color: rgba(96, 165, 250, 0.5);">📈 매물 추이 보기</button>
                <button id="refresh-btn" class="primary-btn">새로고침</button>
            </div>
        </header>

        <div class="summary-cards">
            <div class="card glass clickable-card" id="card-new-btn" role="button" tabindex="0">
                <div class="card-icon new-icon"></div>
                <div class="card-content">
                    <h3>신규매물</h3>
                    <p id="count-new" class="count">0</p>
                </div>
            </div>
            <div class="card glass clickable-card" id="card-re-btn" role="button" tabindex="0">
                <div class="card-icon re-icon"></div>
                <div class="card-content">
                    <h3>매물 재등록</h3>
                    <p id="count-re" class="count">0</p>
                </div>
            </div>
            <div class="card glass clickable-card" id="card-done-btn" role="button" tabindex="0">
                <div class="card-icon done-icon"></div>
                <div class="card-content">
                    <h3>거래 완료 (또는 삭제)</h3>
                    <p id="count-done" class="count">0</p>
                </div>
            </div>
            <div class="card glass">
                <div class="card-icon total-icon"></div>
                <div class="card-content">
                    <h3>현재 활성 매물 (전체)</h3>
                    <p id="count-active" class="count">0</p>
                </div>
            </div>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-apt="더샵동천포레스트">더샵동천포레스트</button>
            <button class="filter-btn" data-apt="울산 힐스테이트 강동">울산 힐스테이트 강동</button>
            <button class="filter-btn" data-apt="한강센트럴자이 1단지">한강센트럴자이 1단지</button>
            <button class="filter-btn" data-apt="선암에코하이츠">선암에코하이츠</button>
        </div>

        <div class="search-container glass" style="margin-bottom: 1.5rem; padding: 1rem;">
            <input type="text" id="search-input" placeholder="아파트명, 동, 가격 등으로 검색..." 
                style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.2); color: white; font-size: 1rem;">
        </div>

        <div style="margin-bottom: 1rem; display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="show-changes-only" style="width: 18px; height: 18px;" checked>
            <label for="show-changes-only" style="font-weight: 500; cursor: pointer;">유지/재등록 매물 숨기기 (신규 및 완료/삭제만 보기)</label>
        </div>

        <main class="dashboard-main glass">
            <div class="table-container">
                <table id="listings-table">
                    <thead>
                        <tr>
                            <th>단지명</th>
                            <th>상태</th>
                            <th>동</th>
                            <th>층</th>
                            <th>면적 (공급/전용)</th>
                            <th>가격</th>
                            <th>등록일</th>
                        </tr>
                    </thead>
                    <tbody id="listings-body">
                        <!-- JS renders rows here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- History Modal (New, Re-reg, Done) -->
    <div id="history-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass" style="max-width: 960px; max-height: 90vh;">
            <div class="modal-header">
                <div>
                    <h2 id="history-modal-title" style="display: flex; align-items: center; gap: 8px;">
                        <span id="history-title-text">📋 거래 완료 내역</span>
                        <span id="history-total-badge" class="history-count-badge badge-done">0건</span>
                    </h2>
                    <p id="history-modal-subtitle" style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">
                        어제부터 시작하여 이전에 거래 완료된 매물의 날짜와 금액을 최신순으로 표시합니다.
                    </p>
                </div>
                <button id="close-history-btn" class="close-btn" aria-label="닫기">&times;</button>
            </div>
            <div class="modal-body" style="display: flex; flex-direction: column; overflow: hidden; padding: 1.2rem;">
                <div class="completed-toolbar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; justify-content: space-between;">
                    <div class="modal-filters" style="display: flex; gap: 6px; flex-wrap: wrap;" id="history-apt-filters">
                        <button class="comp-filter-btn active" data-apt="ALL">전체 단지</button>
                        <button class="comp-filter-btn" data-apt="더샵동천포레스트">더샵동천포레스트</button>
                        <button class="comp-filter-btn" data-apt="울산 힐스테이트 강동">울산 힐스테이트 강동</button>
                        <button class="comp-filter-btn" data-apt="한강센트럴자이 1단지">한강센트럴자이 1단지</button>
                        <button class="comp-filter-btn" data-apt="선암에코하이츠">선암에코하이츠</button>
                    </div>
                    <input type="text" id="history-search-input" placeholder="동, 층, 금액, 날짜 검색..." 
                        style="padding: 0.5rem 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(0,0,0,0.25); color: white; font-size: 0.9rem; min-width: 180px;">
                </div>
                <div class="table-container history-table-container" style="overflow-y: auto; max-height: 520px; border: 1px solid var(--border-color); border-radius: 10px; -webkit-overflow-scrolling: touch;">
                    <table class="history-table" style="width: 100%; border-collapse: collapse;">
                        <thead style="position: sticky; top: 0; background: #1e293b; z-index: 10;">
                            <tr>
                                <th id="history-col-date" style="padding: 0.65rem 0.25rem; text-align: center; color: #94a3b8; font-weight: 600; width: 21%;">완료일자</th>
                                <th style="padding: 0.65rem 0.25rem; text-align: left; color: #94a3b8; font-weight: 600; width: 20%;">동</th>
                                <th style="padding: 0.65rem 0.25rem; text-align: center; color: #94a3b8; font-weight: 600; width: 14%;">층</th>
                                <th id="history-col-price" style="padding: 0.65rem 0.25rem; text-align: right; color: #94a3b8; font-weight: 600; width: 27%;">거래 금액</th>
                                <th style="padding: 0.65rem 0.25rem; text-align: center; color: #94a3b8; font-weight: 600; width: 18%;">등록일</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <!-- JS renders rows here -->
                        </tbody>
                    </table>

                </div>
            </div>
        </div>
    </div>

    <!-- Trend Chart Modal -->
    <div id="chart-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass">
            <div class="modal-header">
                <h2 id="chart-title">매물 수량 추이</h2>
                <button id="close-chart-btn" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="chart-filters" style="margin-bottom: 1rem;">
                    <select id="chart-apt-select" class="glass-select">
                        <option value="더샵동천포레스트">더샵동천포레스트</option>
                        <option value="울산 힐스테이트 강동">울산 힐스테이트 강동</option>
                        <option value="한강센트럴자이 1단지">한강센트럴자이 1단지</option>
                        <option value="선암에코하이츠">선암에코하이츠</option>
                    </select>
                </div>
                <div class="chart-container" style="position: relative; height:400px; width:100%">
                    <canvas id="trendChart"></canvas>
                </div>
                <p style="margin-top: 1rem; font-size: 0.85rem; color: #94a3b8; text-align: center;">
                    * '찐 거래 완료'는 등록 만료(30일 경과)를 제외한 실제 거래/삭제 건수입니다.
                </p>
            </div>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="app-toast" class="toast-msg">마지막 화면입니다.</div>

    <script src="./app.js?v=4.8"></script>
</body>

</html>
